services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        pull_policy: never
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # Left side is the host port from .env; right side is fixed inside
            # the container. Vite is the exception: the browser runs on the host
            # and talks to the HMR server directly, so it is the same number on
            # both sides.
            - '${APP_PORT:-8765}:80'
            - '${VITE_PORT:-8766}:${VITE_PORT:-8766}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # vite.config.ts reads this. Deliberately passed one variable at a
            # time rather than via `env_file: .env`: that would also inject the
            # host-side APP_URL (http://localhost:8765) into the container,
            # where 8765 does not exist, breaking Playwright's baseURL.
            # Laravel reads .env itself off the bind mount, so it needs nothing
            # here. Node processes do.
            VITE_PORT: '${VITE_PORT:-8766}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        # Long syntax with `required: false` so the app still starts when a
        # service is externalised via KEEL_SERVICES (e.g. a host Postgres). When
        # the service IS enabled, Compose still starts it here and waits on the
        # condition below.
        depends_on:
            pgsql:
                condition: service_healthy
                required: false
            redis:
                condition: service_healthy
                required: false
            mailpit:
                condition: service_started
                required: false
    horizon:
        image: 'sail-8.4/app'
        pull_policy: never
        command: ['php', 'artisan', 'horizon']
        restart: unless-stopped
        # Named after the service so KEEL_SERVICES (-> COMPOSE_PROFILES) toggles it.
        profiles: [horizon]
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
                required: false
            redis:
                condition: service_healthy
                required: false
    scheduler:
        image: 'sail-8.4/app'
        pull_policy: never
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped
        profiles: [scheduler]
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
                required: false
    pgsql:
        image: 'postgres:18-alpine'
        profiles: [pgsql]
        ports:
            - '${FORWARD_DB_PORT:-8769}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:8-alpine'
        profiles: [redis]
        ports:
            - '${FORWARD_REDIS_PORT:-8770}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        profiles: [mailpit]
        ports:
            - '${FORWARD_MAILPIT_PORT:-8771}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8767}:8025'
        networks:
            - sail
    pgweb:
        image: 'sosedoff/pgweb:latest'
        # Off by default; `./keel db-gui` starts it on demand, or add `pgweb` to
        # KEEL_SERVICES to have `./keel up` bring it along.
        profiles: [pgweb]
        ports:
            - '${PGWEB_PORT:-8768}:8081'
        environment:
            PGWEB_DATABASE_URL: 'postgres://${DB_USERNAME}:${DB_PASSWORD}@pgsql:${DB_PORT:-5432}/${DB_DATABASE}?sslmode=disable'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
                required: false
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
